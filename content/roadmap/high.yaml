# 高中课程蓝图（docs/10 §2.2 · docs/12 总纲 P1 草案 —— 状态: draft 待精核）
# 说明：条目顺序 = 建议学习序列；主题组顺序与 docs/12 §2 high 骨架一致
# （集合逻辑 → 等式不等式 → 函数(含三角) → 数列 → 向量 → 立体几何 → 解析几何 → 导数 → 统计概率）。
# prereq 指向本文件条目 id（high.hNN）或已入库真实节点 id（middle.*/high.0201，格式含 '.'）；
# anchors 本批为空：高中已入库人工节点仅 high.0201（一次函数，作为 h14 前置衔接使用，未做 covered 占位）。
# 学段间推进由 selfextend 学段顺序保证；跨学段逐条前置仅能引用"已入库节点"，见 IMPLEMENTATION_NOTES。
level: high
entries:
  - id: high.h01
    title: 集合的概念与表示
    topic: 集合与常用逻辑
    objectives: ["元素与集合的关系及确定性/互异性", "常用数集符号", "列举法与描述法表示集合"]
    prereqs: []
    difficulty: 1
  - id: high.h02
    title: 集合间的基本关系
    topic: 集合与常用逻辑
    objectives: ["子集/真子集/集合相等的判定", "空集与集合的关系", "子集个数的计数"]
    prereqs: [high.h01]
    difficulty: 1
  - id: high.h03
    title: 集合的基本运算
    topic: 集合与常用逻辑
    objectives: ["交集/并集/补集与 Venn 图", "由运算关系反求参数", "德摩根律初步"]
    prereqs: [high.h02]
    difficulty: 2
  - id: high.h04
    title: 充分条件与必要条件
    topic: 集合与常用逻辑
    objectives: ["命题与 p⇒q 的含义", "充分/必要/充要条件的判断", "条件与集合包含关系的对应"]
    prereqs: [high.h03]
    difficulty: 2
  - id: high.h05
    title: 全称量词与存在量词
    topic: 集合与常用逻辑
    objectives: ["全称/存在命题及其真假判断", "含量词命题的否定", "量词与参数问题的初步"]
