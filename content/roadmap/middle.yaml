# 初中课程蓝图（docs/10 §2.2 · 工单 C 段全段扩段 —— 状态: draft 待精核）
# 主线（REVIEW-blueprint D + 用户工单 C 段）：有理数 → 整式 → 一元一次方程（锚 middle.0101–0104）
# → 方程应用与不等式 → 二元一次方程组 → 实数与根式 → 平面几何（角/平行/三角形/勾股）→
# 一次函数 → 概率统计初步。列表顺序 = 学习序列；prereq 指向本文件条目 id 或前序学段条目（primary.sNN）。
#
# 说明：
# - m01–m04 为既有首批（id/内容未动），m05 起为本轮扩段新增（id 延续 m05–m31）。
# - 一元一次方程线 4 个锚点（middle.0101 概念 / 0104 等式性质 / 0102 求解 / 0103 应用）按教学序
#   概念 → 等式性质 → 解方程 → 应用 映射到蓝图条目 m11–m14（anchors 覆盖，不重复生成）。
# - **一次函数（m27/m28）不占位 high.0201**：high.0201 是高中人工锚点节点，若作 middle anchors
#   会造成"middle 通关依赖 high 学段节点、而 high 学段解锁依赖 middle 通关"的倒锁；
#   high.0201 继续仅作 high.h14 的前置真实节点引用（R14"一次函数归 middle"落地为 middle 待生成 auto）。
# - 统计概率组首条 m29 prereq 引用 primary.s21（跨学段蓝图条目，A 段机制：方向=前序学段合法，
#   小学统计内容落地后无缺口；未落地时生成剔除 + 缺口提示，学段顺序兜底）。
level: middle
entries:
  - id: middle.m01
    title: 负数与数轴
    topic: 代数·数轴与整式初步
    objectives: ["负数意义与数轴表示", "比较大小"]
    prereqs: []
    anchors: [middle.0201]
    difficulty: 1
  - id: middle.m02
    title: 有理数的加法
    topic: 代数·数轴与整式初步
    objectives: ["同号/异号加法法则", "数轴理解加法"]
    prereqs: [middle.m01]
    anchors: [middle.0202]
    difficulty: 2
  - id: middle.m03
    title: 整式的概念与同类项
    topic: 代数·数轴与整式初步
    objectives: ["单项式/多项式与次数", "同类项识别与合并"]
    prereqs: [middle.m02]
    difficulty: 2
  - id: middle.m04
    title: 整式的加减与去括号
    topic: 代数·数轴与整式初步
    objectives: ["去括号法则", "整式加减运算"]
    prereqs: [middle.m03]
    difficulty: 3
    requires_thinking: true
  - id: middle.m05
    title: 有理数的乘法与除法
    topic: 代数·有理数与实数
    objectives: ["符号法则与绝对值相乘除", "倒数与除法转化", "乘除混合的运算顺序"]
    prereqs: [middle.m01]
    difficulty: 2
  - id: middle.m06
    title: 有理数的乘方与科学记数法
    topic: 代数·有理数与实数
    objectives: ["乘方的意义与符号规律", "科学记数法表示大/小数"]
    prereqs: [middle.m05]
    difficulty: 2
  - id: middle.m07
    title: 有理数混合运算与运算律
    topic: 代数·有理数与实数
    objectives: ["三级混合运算顺序", "交换/结合/分配律的简便计算"]
    prereqs: [middle.m06]
    difficulty: 2
  - id: middle.m08
    title: 平方根与立方根
    topic: 代数·有理数与实数
    objectives: ["算术平方根与平方根", "立方根", "开方与乘方互逆"]
    prereqs: [middle.m06]
    difficulty: 2
  - id: middle.m09
    title: 实数与数轴（无理数）
    topic: 代数·有理数与实数
    objectives: ["无理数与实数分类", "实数在数轴上的表示", "实数大小的比较"]
    prereqs: [middle.m08, middle.m01]
    difficulty: 2
    requires_thinking: true
  - id: middle.m10
    title: 二次根式及其运算
    topic: 代数·有理数与实数
    objectives: ["二次根式的意义与性质", "最简二次根式与化简", "二次根式加减乘除"]
    prereqs: [middle.m08]
    difficulty: 3
    requires_thinking: true
  - id: middle.m11
    title: 一元一次方程的概念
    topic: 代数·方程不等式与方程组
    objectives: ["方程/方程的解/解方程", "一元一次方程的识别"]
