# AI 进阶课程蓝图（docs/10 §2.2 · docs/12 总纲 P3 草案 —— 状态: draft 待精核）
# 说明：条目顺序 = 建议学习序列；主题组顺序与 docs/12 §2 ai 骨架一致（机器学习数学基础 → 凸优化 →
# 信息论与熵 → 矩阵分析/范数/正则化 → 高维概率与统计学习理论 → 时间序列与随机过程 → 量化应用）。
# prereq 指向本文件条目 id（ai.aNN）；anchors 留空（全部待生成/运行期懒生成）。
#
# 【依赖 college 的衔接说明】（docs/12 §2 注：ai 学段编排需在 college 完成后自然衔接；机械层面由
#   selfextend 学段顺序保证——college 通关后才解锁 ai。蓝图 prereq 仅限本文件内，见 IMPLEMENTATION_NOTES）
#   A. 入口假设：进入 ai 前 college 已通关，默认掌握一元/多元微积分、线性代数、概率论与数理统计、
#      离散与数值计算初步（college.c01–c56）。
#   B. 机器学习数学基础（a01–a10）在 college 概率/线代/优化基础上以"模型-损失-风险"视角重述，
#      不重复教材推导；梯度下降在 a07 给直觉，严格收敛分析在凸优化 run（a13）。
#   C. 凸优化与数值优化（a11–a19）假定 college 微积分最值（c20 拉格朗日）与数值初步（c51–c56）。
#   D. 信息论与熵（a20–a25）假定 college 概率（c35–c38）与离散组合（c49 生成函数）；微分熵需微积分。
#   E. 矩阵分析/范数/正则化（a26–a33）假定 college 线性代数全部（c25–c34，含特征值/二次型/SVD 前置）。
#   F. 高维概率与统计学习理论（a34–a41）假定 college 数理统计（c40–c43）与概率极限（c39）。
#   G. 时间序列与随机过程（a42–a49）：docs/12 注"随机过程亦可作 college 拓展"——本批置于 ai 主线，
#      若需在 college 先行扩展（衔接经济/量化路径）请架构裁决后回填 college.yaml（本 P3 不改动 college）。
#   H. 量化应用（a50–a57）假定 college 概率统计/优化（c20/c34/c39/c42/c43）与本文件 run2/run6 前置。
# 【模型档位】R12 基础档：college/ai → think（运行期由 ai/tier 决策链保证）；requires_thinking 字段在
#   ai 学段作为"精核建议标注"（true=理论/推导/建模深档，false=计算/工具/讨论类可快档），不改变运行期默认档。
level: ai
