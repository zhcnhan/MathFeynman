# 大学课程蓝图（docs/10 §2.2 · docs/12 总纲 P2 草案 —— 状态: draft 待精核）
# 说明：条目顺序 = 建议学习序列；主题组顺序与 docs/12 §2 college 骨架一致
# （一元微积分 → 多元函数微积分 → 线性代数 → 概率论与数理统计 → 离散数学初步 → 数值计算初步）。
# prereq 指向本文件条目 id（college.cNN）；anchors 留空（大学阶段内容全部待生成/运行期懒生成）。
#
# 【与 high 的衔接假设】（docs/12 §2：本批含衔接假设，供精核；机械层面学段推进由 selfextend 顺序保证，
#   蓝图 prereq 仅限本文件内条目——跨学段引用需指向"已在库节点"，见 IMPLEMENTATION_NOTES 疑点）
#   A. 入口假设：进入 college 前 high 学段已通关（selfextend 学段顺序），默认掌握高中代数/函数/三角/
#      数列/向量/立体几何/解析几何/导数/统计概率主线。
#   B. 一元微积分（c01–c15）：假定已会"函数/极限初感/导数概念/初等函数性质"（high 函数线 h14–h30 内容），
#      c01 极限正式化、c04 导数系统化均在此基础上展开，不重复高中入门内容。
#   C. 多元函数微积分（c16–c24）：假定已掌握一元微积分（本文件 run1）与高中平面向量/空间向量/立体几何
#      （high h37–h47），空间解析几何作为衔接入口放在 run2 之首。
#   D. 线性代数（c25–c34）：假定高中"平面向量坐标法 + 一次方程组 + 行列式概念的代数十进制基础"
#      （high h37–h40、middle 方程线内容节点）；行列式公理化定义从头建立，不依赖微积分。
#   E. 概率论与数理统计（c35–c43）：假定高中古典概型/条件概率/分布列/期望方差（high h69–h78）；
#      本 run 公理化重述并推进到数理统计。回归与最小二乘部分依赖线性代数 run（c34 最小二乘初步先行）。
#   F. 离散数学初步（c44–c50）：假定高中集合/逻辑初步（high h01–h06）与组合计数基础（high h69–h72）。
#   G. 数值计算初步（c51–c56，工具线）：docs/12 §2"视需要并入 ai"——本批先放 college 工具线；
#      需要一元微积分（定积分/微分方程）与线性代数（方程组/矩阵）作应用对象。
