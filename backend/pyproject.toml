[project]
name = "yanhui-backend"
version = "0.1.0"
description = "YanHui 后端：通用费曼学习教练（任意学科；数学为首个预置学科）——图谱/判题/会话状态机/复习与费曼闭环"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",  # FastAPI 文件/表单上传（materials/upload-pdf，Phase C C2）
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sympy>=1.12",
    "httpx>=0.27",
    "fsrs>=6.0",   # FSRS 算法族官方实现（docs/03 §3）；domain.fsrs 封装，便于日后替换
    "PyYAML>=6.0", # content 节点文件 front-matter 解析（docs/04）
    "pypdf>=6.0",  # 材料层 PDF → 分页/分节文本（Phase C C2；BSD-3-Clause，纯 Python，Py3.14 兼容）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# R57 任务 A（方案 a）：PDF → 页面图片渲染（图示教材模式"直接传 PDF"用）。
# 许可：pypdfium2 = BSD-3-Clause / Apache-2.0（PDFium 二进制打包在 wheel 里，无需系统依赖）；
#       Pillow = MIT-CMU（BSD 系）。**不用** PyMuPDF（AGPL）、**不用** pdf2image（要 poppler 系统依赖）。
# 没装也能跑：本模式会回落"用户自己导出图片"（方案 c），并给中文说明（绝不静默失败）。
render = [
    "pypdfium2>=4.30",
    "Pillow>=10.0",
]

[project.scripts]
# docs/04 §7：`content validate` / `content render <node_id> <seed>`（等价于文档中的
# `python -m content validate`；editable 安装后任意目录可用）
content = "app.content.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
