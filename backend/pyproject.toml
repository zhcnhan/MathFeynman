[project]
name = "yanhui-backend"
version = "0.1.0"
description = "YanHui 后端：本地单机 AI 数学导师（图谱/判题/会话状态机/复习/费曼）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sympy>=1.12",
    "httpx>=0.27",
    "fsrs>=6.0",   # FSRS 算法族官方实现（docs/03 §3）；domain.fsrs 封装，便于日后替换
    "PyYAML>=6.0", # content 节点文件 front-matter 解析（docs/04）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
# docs/04 §7：`content validate` / `content render <node_id> <seed>`（等价于文档中的
# `python -m content validate`；editable 安装后任意目录可用）
content = "app.content.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
